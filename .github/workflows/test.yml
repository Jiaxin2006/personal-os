name: Personal OS tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 tools/build_macos.py --without-paintings --output "$RUNNER_TEMP/Personal OS.app"
